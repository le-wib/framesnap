name: Release builds

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# read only by default: only the publish job below can write (it creates the Release)
permissions:
  contents: read

jobs:
  macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15          # Apple Silicon
            label: AppleSilicon
          - runner: macos-15-intel    # Intel
            label: Intel
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Run tests (informational, the selftest of the packaged app below is the gate)
        continue-on-error: true
        run: python -m pytest -q
      - name: Build app and dmg (includes a selftest of the packaged app)
        run: bash packaging/build_macos.sh "${{ matrix.label }}"
      - uses: actions/upload-artifact@v6
        with:
          name: FrameSnap-macOS-${{ matrix.label }}
          path: dist/*.dmg
          if-no-files-found: error

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Run tests (informational on Windows, the selftest below is the gate)
        continue-on-error: true
        run: python -m pytest -q
      - name: Build app, zip and installer (includes a selftest of the packaged app)
        shell: pwsh
        run: ./packaging/build_windows.ps1
      - uses: actions/upload-artifact@v6
        with:
          name: FrameSnap-Windows
          path: |
            dist/FrameSnap-*-Windows.zip
            dist/FrameSnap-*-Windows-Setup.exe
          if-no-files-found: error

  publish:
    # every platform must have built and passed its selftest: no half release
    needs: [macos, windows]
    if: ${{ startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          pattern: FrameSnap-*
          merge-multiple: true
          path: release-files
      - run: ls -la release-files
      - name: Create the GitHub Release (GitHub CLI, no third party action)
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release upload "$TAG" release-files/* --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" release-files/* --generate-notes --verify-tag --repo "$GITHUB_REPOSITORY"
          fi
